<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Mustafa Türker</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { background: #edf2f5; display: flex; align-items: center; justify-content: center; }
        .flag { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 3px solid #fff; box-shadow: 0 6px 24px rgba(0,0,0,0.15); opacity: 0; animation: show 1s ease 0.2s forwards; }
        .flag svg { width: 100%; height: 100%; display: block; }
        @keyframes show { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @media (prefers-reduced-motion: reduce) { .flag { opacity: 1; animation: none; } }
    </style>
</head>
<body>
    <div class="flag">
        <svg viewBox="0 0 100 100" role="img" aria-label="Türk bayrağı">
            <circle cx="50" cy="50" r="50" fill="#E30A17"/>
            <circle cx="45.5" cy="50" r="21" fill="white"/>
            <circle cx="50.75" cy="50" r="16.8" fill="#E30A17"/>
            <polygon fill="white" points="60,50 65.07,48.24 65.18,42.87 68.43,47.15 73.57,45.59 70.5,50 73.57,54.41 68.43,52.85 65.18,57.13 65.07,51.76"/>
        </svg>
    </div>
</body>
</html>
