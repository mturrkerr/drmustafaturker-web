<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Mustafa Türker | Göğüs Cerrahisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;500;600&display=swap');
        .font-serif { font-family: 'Merriweather', serif; }
        .font-sans { font-family: 'Inter', sans-serif; }
        
        .crisp-image {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<!-- Eklenti: Site açılışında kaydırmayı engellemek için overflow-hidden eklendi -->
<body class="bg-[#edf2f5] text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between select-none overflow-hidden">

    <!-- ŞİFRE GİRİŞ EKRANI (YENİ EKLENDİ) -->
    <div id="loginScreen" class="fixed inset-0 bg-[#edf2f5] z-[9999] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="bg-white p-8 rounded-3xl shadow-xl text-center max-w-sm w-full mx-4 border border-gray-100">
            <!-- Kilit İkonu -->
            <div class="w-14 h-14 rounded-full bg-[#094d61] mx-auto mb-5 flex items-center justify-center shadow-lg shadow-[#094d61]/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            
            <h2 class="text-2xl font-serif font-bold text-[#14262c] mb-2">Hoş Geldiniz</h2>
            <p class="text-gray-500 text-sm mb-6">Sunuma erişmek için lütfen şifrenizi girin.</p>
            
            <input type="password" id="passwordInput" onkeypress="handleLoginKeyPress(event)" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#0d687a]/50 focus:border-[#0d687a] text-center text-xl font-bold tracking-[0.3em] mb-4 bg-gray-50 transition-all" placeholder="••" autocomplete="off">
            
            <button onclick="checkPassword()" class="w-full bg-[#094d61] hover:bg-[#0d687a] text-white font-semibold py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-[#094d61]/20 active:scale-[0.98]">
                Giriş Yap
            </button>
            
            <!-- Hata Mesajı -->
            <p id="errorMessage" class="text-red-500 text-sm mt-4 font-medium opacity-0 transition-opacity duration-300">
                Hatalı şifre, lütfen tekrar deneyin.
            </p>
        </div>
    </div>
    <!-- /ŞİFRE EKRANI SONU -->

    <!-- Üst/Ana Bölüm (Hero) -->
    <main class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
        
        <!-- Ortalanmış Vektörel Türk Bayrağı İkonu -->
        <div class="w-9 h-9 md:w-10 md:h-10 rounded-full overflow-hidden border border-white shadow-sm mb-4 transition-transform hover:scale-110 flex items-center justify-center bg-[#E30A17]">
            <svg viewBox="0 0 100 100" class="w-full h-full">
                <circle cx="50" cy="50" r="50" fill="#E30A17"/>
                <circle cx="45.5" cy="50" r="21" fill="white"/>
                <circle cx="50.75" cy="50" r="16.8" fill="#E30A17"/>
                <polygon fill="white" points="60,50 65.07,48.24 65.18,42.87 68.43,47.15 73.57,45.59 70.5,50 73.57,54.41 68.43,52.85 65.18,57.13 65.07,51.76"/>
            </svg>
        </div>

        <!-- Büyük Ana Başlık: GÖĞÜS CERRAHİSİ -->
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-serif font-bold text-[#14262c] mb-3 uppercase tracking-wide">
            Göğüs Cerrahisi
        </h1>
        
        <!-- Alt Başlık / İsim: Ass. Dr. Mustafa Türker -->
        <h2 class="text-xl md:text-2xl font-semibold text-[#0d687a] mb-12">
            Ass. Dr. Mustafa Türker
        </h2>
        
        <!-- GEZİNTİ MENÜSÜ -->
        <div class="relative group/main">
            
            <!-- Menü Butonu (Hamburger İkonu) -->
            <button class="w-14 h-14 bg-[#094d61] hover:bg-[#0d687a] rounded-full flex items-center justify-center shadow-lg shadow-[#094d61]/20 cursor-pointer transition-all duration-300 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            
            <!-- 1. Seviye Menü Kutusu -->
            <div class="absolute top-full left-1/2 -translate-x-1/2 mt-3 w-60 bg-white rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.12)] border border-gray-100 opacity-0 invisible group-hover/main:opacity-100 group-hover/main:visible transition-all duration-300 transform translate-y-2 group-hover/main:translate-y-0 z-50 p-2">
                
                <div class="relative group/sub">
                    <!-- Vaka Örnekleri Başlığı -->
                    <div onclick="openVakalarSection()" class="w-full text-left px-4 py-3 text-sm font-medium text-[#14262c] hover:bg-[#edf2f5] hover:text-[#0d687a] rounded-xl transition-colors flex items-center justify-between cursor-pointer">
