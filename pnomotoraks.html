<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pnömotoraks Vakaları - Dr. Mustafa Türker</title>
    <style>
        html, body { min-height: 100%; margin: 0; }
        body { background: #edf2f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #1f2a33; padding: 40px 16px; box-sizing: border-box; }
        main { max-width: 820px; margin: 0 auto; }
        .back { display: inline-block; color: #1f2a33; text-decoration: none; background: #fff; padding: 10px 18px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); font-weight: 600; margin-bottom: 28px; }
        h1 { margin: 0 0 24px; font-size: 26px; color: #1f3a52; }
        .case { background: #fff; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 24px; }
        .case h2 { margin: 0 0 16px; font-size: 19px; color: #1f3a52; }
        .images { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        figure { margin: 0; }
        figure a { display: block; border-radius: 10px; overflow: hidden; background: #000; }
        figure img { width: 100%; height: auto; display: block; }
        figcaption { margin-top: 8px; font-size: 14px; color: #5a6a77; text-align: center; }
    </style>
</head>
<body>
    <main>
        <a class="back" href="./">← Ana sayfa</a>
        <h1>Pnömotoraks Vakaları</h1>
        <section class="case">
            <h2>Vaka 1</h2>
            <div class="images">
                <figure>
                    <a href="images/pnomotoraks-1.jpg" target="_blank" rel="noopener"><img src="images/pnomotoraks-1.jpg" alt="Vaka 1: Akciğer grafisi" loading="lazy"></a>
                    <figcaption>Akciğer grafisi</figcaption>
                </figure>
                <figure>
                    <a href="images/pnomotoraks-1-isaretli.jpg" target="_blank" rel="noopener"><img src="images/pnomotoraks-1-isaretli.jpg" alt="Vaka 1: Pnömotoraks alanı ok ile işaretlenmiş akciğer grafisi" loading="lazy"></a>
                    <figcaption>Pnömotoraks alanı işaretli</figcaption>
                </figure>
            </div>
        </section>
    </main>
</body>
</html>
